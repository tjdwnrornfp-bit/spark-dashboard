name: Monthly settlement integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  monthly-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_ci_only
      PGDATABASE: postgres
      MONTHLY_CONCURRENCY_TEST: isolated-ci
      MONTHLY_UI_DIR: /tmp/spark-monthly-ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:monthly
      - run: python tests/monthly-settlement-concurrency.py
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify UI to database and XLSX on desktop and mobile
        run: |
          node tests/monthly-settlement-browser.mjs >/tmp/monthly-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          python tests/monthly-settlement-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-settlement-verification
          path: /tmp/spark-monthly-ui/
          retention-days: 7
