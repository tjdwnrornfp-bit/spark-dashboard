name: Program retirement integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  program-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RETIREMENT_UI_DIR: /tmp/spark-retirement-ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:retirement
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify retirement and real member approval on desktop and mobile
        run: |
          node tests/program-retirement-browser.mjs >/tmp/retirement-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          python tests/program-retirement-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-retirement-verification
          path: /tmp/spark-retirement-ui/
          retention-days: 7
