name: Blackout verification workspace
on:
  push:
    branches: ['feat/start-date-blackouts-v10-12']
    paths: ['.github/workflows/blackout-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o /tmp/spark-blackout-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: spark-blackout-source
          path: /tmp/spark-blackout-source.tar.gz
          retention-days: 1
