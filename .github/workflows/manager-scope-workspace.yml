name: Manager scope verification source
on:
  push:
    branches: [fix/manager-descendant-scope-v10-13]
    paths: [.github/workflows/manager-scope-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD -o /tmp/spark-manager-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: spark-manager-source
          path: /tmp/spark-manager-source.tar
          retention-days: 1
