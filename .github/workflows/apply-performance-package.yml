name: Apply verified performance package
on:
  push:
    branches: ["perf/2026-09-21"]
    paths:
      - '.ci/performance.patch.xz.*'
      - '.github/workflows/apply-performance-package.yml'
permissions:
  contents: write
concurrency:
  group: spark-performance-package
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply exact reviewed patch
        run: |
          git merge-base --is-ancestor 34eed324a052d1773048565f0f489af394a0cc75 HEAD
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.ci').glob('performance.patch.xz.*'))
          assert len(parts) == 5, 'Incomplete patch package'
          patch = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '3ad350d2af23db1b4b831f986320f5f7a1a386e98f5a3916f61b1975dfd44df8', 'Patch integrity mismatch'
          target = pathlib.Path('/tmp/performance.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
      - run: npm ci
      - name: Run all regressions and production build
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/performance-verify.log
      - name: Commit verified application files to the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src supabase/migrations tests package.json package-lock.json vercel.json APPLY_V10_11.md
          git commit -m 'perf: bounded server reads and scoped rendering v10.11.0'
          git push origin HEAD:refs/heads/perf/2026-09-21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-package-verification
          path: /tmp/performance-verify.log
          retention-days: 7
