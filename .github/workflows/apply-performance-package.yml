name: Final write refresh verification
on:
  push:
    branches: ["perf/2026-09-21"]
    paths:
      - '.ci/final-refresh.patch'
      - '.github/workflows/apply-performance-package.yml'
permissions:
  contents: write
concurrency:
  group: spark-performance-package
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check and apply reviewed refresh fix
        run: |
          echo 'cc4100282b5f238ffd3bc262ae3e6d8c212b357286028b5567eea1d20695b54b  .ci/final-refresh.patch' | sha256sum -c -
          git apply --check .ci/final-refresh.patch
          git apply .ci/final-refresh.patch
      - run: npm ci
      - name: Verify all regressions and production build
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/performance-verify.log
      - name: Commit verified refresh fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx tests/performance-client.mjs
          git commit -m 'fix: refresh authoritative pages after status and archive writes'
          git push origin HEAD:refs/heads/perf/2026-09-21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-performance-verification
          path: /tmp/performance-verify.log
          retention-days: 7
